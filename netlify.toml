[build]
  # public/_headers is for Cloudflare Pages (spec 0013). Netlify would apply it
  # on top of the headers below, so every Netlify build removes it.
  command = "pnpm build && rm -f dist/_headers"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # The git hook is for local commits; GitHub Actions runs the checks.
  SKIP_INSTALL_SIMPLE_GIT_HOOKS = "1"

# Headers in this file apply to every deploy context, so previews get their
# noindex header from a _headers file copied in by their own build command
# (after the Cloudflare one is removed).
[context.deploy-preview]
  command = "pnpm build && rm -f dist/_headers && cp config/preview-headers dist/_headers"

[context.branch-deploy]
  command = "pnpm build && rm -f dist/_headers && cp config/preview-headers dist/_headers"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Everything is self hosted except Umami (spec 0010): the script loads from
    # cloud.umami.is and posts to gateway.umami.is. Styles allow inline for the
    # font face block Astro writes into the head.
    # Stopgap until the move to Cloudflare Pages (spec 0013 AC-1): inline scripts
    # are allowed here only, so Netlify's badge draws instead of leaving an empty
    # frame that blocks taps. public/_headers keeps the strict policy.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cloud.umami.is; connect-src 'self' https://gateway.umami.is; style-src 'self' 'unsafe-inline'; img-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests"

# Hashed build files never change, so browsers may cache them for a year.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
